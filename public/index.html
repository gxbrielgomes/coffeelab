<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14100d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CoffeeLab" />
  <title>CoffeeLab</title>
  <link rel="icon" href="icon-v2.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-v2.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/inicio">
        <span class="brand-mark" aria-hidden="true"><img src="logo-v2.png" alt=""></span>
        <span><span class="brand-name">Coffee<em>Lab</em></span></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <button class="nav-timer" data-action="open-timer">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
        <span>Timer</span>
        <span class="nav-timer-time" id="navTimerTime"></span>
      </button>
    </aside>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="overlay" id="modalRoot" hidden></div>
  <div class="timer-overlay" id="timerRoot" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
