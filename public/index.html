<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0908" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CoffeeLab" />
  <title>CoffeeLab</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M16 3c-6 0-10 5.5-10 13s4 13 10 13 10-5.5 10-13S22 3 16 3Z" fill="var(--leather)"/><path d="M16.6 5c-3.2 4-3.4 7.6-1.2 11s2 7.6-1.4 11" stroke="var(--bg)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">Coffee<em>Lab</em></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <button class="nav-timer" data-action="open-timer">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
        <span>Timer</span>
        <span class="nav-timer-time" id="navTimerTime"></span>
      </button>
    </aside>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="overlay" id="modalRoot" hidden></div>
  <div class="timer-overlay" id="timerRoot" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
